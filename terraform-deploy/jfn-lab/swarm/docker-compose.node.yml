# One JFN node (etcd flavour). Started on every worker VM by the bootstrapper,
# which exports ETCD_ENDPOINT ("ip:2379") = the etcd member assigned to this worker.

networks:
  jfn:
    external: true

services:
  jocker:
    image: jolielang/jocker
    privileged: true
    volumes:
      - /var/run:/var/run
    security_opt:
      - label:disable
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: none
    networks:
      - jfn

  catalog:
    image: jfn/function_catalog:etcd
    environment:
      FUNCTION_CATALOG_LOCATION: "socket://0.0.0.0:8002"
      # was: socket://${HOST_IP}:2379 (etcd member on the same VM).
      # Now the etcd member on a dedicated etcd VM, chosen by the bootstrapper.
      ETCD_LOCATION: "socket://${ETCD_ENDPOINT}"
      VERBOSE: "true"
    ports:
      - "8002:8002"
    networks:
      - jfn

  provisioner:
    image: jfn/provisioner
    environment:
      ADVERTISE_LOCATION: "socket://provisioner:8001"
      PROVISIONER_LOCATION: "socket://0.0.0.0:8001"
      FUNCTION_CATALOG_LOCATION: "socket://catalog:8002"
      DOCKER_NETWORK: "jfn"
      MIN_RUNNERS: "1"
      CALLS_PER_RUNNER: "2"
      CALLS_FOR_PROMOTION: "3"
      CALLS_PER_SINGLETON: "12"
      VERBOSE: "true"
      DEBUG: "false"
    depends_on:
      - jocker
    networks:
      - jfn

  gateway:
    image: jfn/gateway
    ports:
      - "8000:8000"
    environment:
      GATEWAY_LOCATION: "socket://0.0.0.0:8000"
      PROVISIONER_LOCATION: "socket://provisioner:8001"
      FUNCTION_CATALOG_LOCATION: "socket://catalog:8002"
      VERBOSE: "false"
    depends_on:
      - provisioner
    networks:
      - jfn

  runner:
    image: jfn/runner
    environment:
      RUNNER_LOCATION: "socket://0.0.0.0:8010"
      ADVERTISE_LOCATION: "socket://runner:8010"
      FUNCTION_CATALOG_LOCATION: "socket://catalog:8002"
      PROVISIONER_LOCATION: "socket://provisioner:8001"
      VERBOSE: "true"
      DEBUG: "false"
    depends_on:
      - provisioner
      - catalog
    networks:
      - jfn

  singleton:
    image: jfn/singleton
    environment:
      SINGLETON_LOCATION: "socket://0.0.0.0:8011"
      ADVERTISE_LOCATION: "socket://singleton:8011"
      FUNCTION_CATALOG_LOCATION: "socket://catalog:8002"
      PROVISIONER_LOCATION: "socket://provisioner:8001"
      FUNCTION: "hello"
      VERBOSE: "true"
      DEBUG: "false"
    depends_on:
      - provisioner
      - catalog
    networks:
      - jfn
