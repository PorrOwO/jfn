# Deployed by deploy.sh:  docker stack deploy -c swarm-stack.yaml jfn
# Starts one JFN node per worker VM and the load balancer.
# The fixed etcd tier is a separate stack (generated/etcd-stack.yaml, deployed first).

configs:
  node_compose:
    # configs are immutable, so the name carries a hash of the file (set by deploy.sh)
    name: jfn_node_compose_${NODE_COMPOSE_HASH}
    file: ./docker-compose.node.yml

services:
  # ─── JFN NODE BOOTSTRAPPER (one per worker VM, NOT on the etcd VMs) ─
  node-bootstrapper:
    image: docker:25-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: node_compose
        target: /jfn/docker-compose.node.yml
    environment:
      - ETCD_ENDPOINTS=${ETCD_ENDPOINTS}
    stop_grace_period: 90s
    command:
      - sh
      - -c
      - |
        set -e
        docker network inspect jfn >/dev/null 2>&1 || docker network create jfn
        # static assignment: worker i uses etcd member (i mod N)
        NODE_NAME=$$(docker info --format '{{.Name}}')
        IDX=$${NODE_NAME##*-}
        N=$$(echo $$ETCD_ENDPOINTS | wc -w)
        export ETCD_ENDPOINT=$$(echo $$ETCD_ENDPOINTS | tr ' ' '\n' | sed -n "$$((IDX % N + 1))p")
        echo "node $$NODE_NAME uses etcd member $$ETCD_ENDPOINT"
        C="docker compose -p jfn -f /jfn/docker-compose.node.yml"
        $$C down --remove-orphans || true
        $$C up -d --remove-orphans
        # drain / scale-in: stop the node's containers cleanly
        trap '$$C down' TERM INT
        tail -f /dev/null & wait $$!
    deploy:
      mode: global
      placement:
        constraints: [node.labels.jfn-role == worker]   # set by deploy.sh
      restart_policy:
        condition: on-failure

  # ─── NGINX LOAD BALANCER ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
    volumes:
      # generated by deploy.sh from the live list of workers
      - /opt/jfn/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
