networks:
  jfn:
    name: jfn

services:

  couchdb:
    image: couchdb:3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=admin
    ports:
      - "5984:5984"
    networks:
      - jfn
    healthcheck:
      test: ["CMD", "curl", "-f", "http://admin:admin@localhost:5984/_up"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s  # <-- Gives CouchDB 10 seconds to boot before counting failures

  jocker:
    image: jolielang/jocker
    privileged: true                       # Required for deep container orchestration
    volumes:
      - /var/run:/var/run
    security_opt:
      - label:disable                      # Workaround to bypass SELinux socket blocking
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - jfn

  catalog:
    image: jfn/function_catalog
    build:
      context: ..
      dockerfile: docker/Dockerfile.function_catalog
    environment:
      - FUNCTION_CATALOG_LOCATION=socket://0.0.0.0:8002
      - COUCHDB_LOCATION=socket://couchdb:5984      # <-- Changed
      - COUCHDB_USER=admin                           # <-- Added
      - COUCHDB_PASSWORD=admin                       # <-- Added
      - VERBOSE=true
    depends_on:
      couchdb:
        condition: service_healthy                                      # <-- Changed
    networks:
      - jfn
      
  provisioner:
    image: jfn/provisioner
    build: # comment out this section in production
      context: ..
      dockerfile: docker/Dockerfile.provisioner
    environment:
      ADVERTISE_LOCATION: "socket://provisioner:8001"
      PROVISIONER_LOCATION: "socket://0.0.0.0:8001"
      FUNCTION_CATALOG_LOCATION: "socket://catalog:8002"
      DOCKER_NETWORK: "jfn"
      MIN_RUNNERS: 1
      CALLS_PER_RUNNER: 2
      CALLS_FOR_PROMOTION: 3
      CALLS_PER_SINGLETON: 12
      VERBOSE: true
      DEBUG: false
    depends_on:
      - jocker
    networks:
      - jfn

  gateway:
    image: jfn/gateway
    build: # comment out this section in production
      context: ..
      dockerfile: docker/Dockerfile.gateway
    ports:
      - 8000:8000
    environment:
      GATEWAY_LOCATION: "socket://0.0.0.0:8000"
      PROVISIONER_LOCATION: "socket://provisioner:8001"
      FUNCTION_CATALOG_LOCATION: "socket://catalog:8002"
      VERBOSE: false
    depends_on:
      - provisioner
    networks:
      - jfn

