networks:
  jfn_overlay:
    driver: overlay
    attachable: true

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    environment:
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - target: 2379
        published: 2379
        protocol: tcp
        mode: host
    networks:
      - jfn_overlay
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  node-bootstrapper:
    image: docker:25-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/jfn/docker/docker-compose.node.yml:/root/jfn/docker/docker-compose.node.yml
      - /root/jfn:/root/jfn
    working_dir: /root/jfn/docker
    command: >
      sh -c "docker network create jfn 2>/dev/null || true;
             docker compose -f docker-compose.node.yml down --remove-orphans 2>/dev/null;
             docker compose -f docker-compose.node.yml up -d --remove-orphans && tail -f /dev/null"
    networks:
      - jfn_overlay
    deploy:
      mode: global
      placement:
        constraints: [node.labels.jfn-role == worker]
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
    volumes:
      - /root/jfn/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - jfn_overlay
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]