networks:
  jfn_overlay:
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: 1250

services:
  # ─── 3- COUCHDB CLUSTER ───────────────────────────────────────────
  couchdb-0:
    image: couchdb:3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - COUCHDB_SECRET=jfn-secret-key
      - ERL_FLAGS=-setcookie "jfn-cookie"
    ports:
      - target: 5984
        published: 5984
        protocol: tcp
        mode: host          # reachable from host network (JFN containers)
    networks:
      - jfn_overlay         # peer-to-peer Erlang replication traffic
    volumes:
      - couchdb-data-0:/opt/couchdb/data
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.couchdb-node == 0]

  couchdb-1:
    image: couchdb:3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - COUCHDB_SECRET=jfn-secret-key
      - ERL_FLAGS=-setcookie "jfn-cookie"
    ports:
      - target: 5984
        published: 5984
        protocol: tcp
        mode: host
    networks:
      - jfn_overlay
    volumes:
      - couchdb-data-1:/opt/couchdb/data
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.couchdb-node == 1]

  couchdb-2:
    image: couchdb:3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - COUCHDB_SECRET=jfn-secret-key
      - ERL_FLAGS=-setcookie "jfn-cookie"
    ports:
      - target: 5984
        published: 5984
        protocol: tcp
        mode: host
    networks:
      - jfn_overlay
    volumes:
      - couchdb-data-2:/opt/couchdb/data
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.couchdb-node == 2]

# ─── JFN NODE BOOTSTRAPPER ─────────────────────────────────────────
  node-bootstrapper:
    image: docker:25-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JFN_PATH}/docker/docker-compose.node.yml:/root/jfn/docker/docker-compose.node.yml
      - ${JFN_PATH}:/root/jfn
    working_dir: /root/jfn/docker
    environment:
      - MANAGER_IP=${MANAGER_IP}
    command: >
      sh -c "
        docker network create jfn 2>/dev/null || true;
        GATEWAY_IP=$$(docker network inspect jfn --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}');
        echo \"Bridge gateway IP: $$GATEWAY_IP\";
        export HOST_IP=$$GATEWAY_IP;
        docker compose -f docker-compose.node.yml down --remove-orphans 2>/dev/null;
        docker compose -f docker-compose.node.yml up -d --remove-orphans && tail -f /dev/null
      "
    networks:
      - jfn_overlay
    deploy:
      mode: global
      placement:
        constraints: [node.labels.jfn-role == worker]
      restart_policy:
        condition: on-failure

  # ─── NGINX LOAD BALANCER ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
    volumes:
      - ${JFN_PATH}/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - jfn_overlay
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

volumes:
  couchdb-data-0:
  couchdb-data-1:
  couchdb-data-2:
