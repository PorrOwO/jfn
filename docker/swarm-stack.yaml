version: "3.9"

networks:
  jfn_overlay:
    driver: overlay
    attachable: true

services:
  # 1. Shared etcd cluster (The Brain)
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    environment:
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    networks: [jfn_overlay]
    deploy:
      replicas: 1 # Use 3 for production HA
      placement:
        constraints: [node.role == manager]

  # 2. The Bootstrapper (Runs the local compose file on every node)
  node-bootstrapper:
    image: docker:25-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/jfn/docker-compose.yml:ro
    environment:
      # Pass the etcd overlay DNS to the local catalog
      - ETCD_LOCATION=socket://etcd:2379 
    working_dir: /jfn
    command: >
      sh -c "docker compose up -d --remove-orphans && tail -f /dev/null"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure

  # 3. The Gateway (Swarm Routing Mesh)
  gateway:
    image: jfn/gateway
    ports:
      - target: 8000
        published: 8000
        mode: ingress                      # Swarm routing mesh distributes traffic
    environment:
      - GATEWAY_LOCATION=socket://0.0.0.0:8000
      # Talk to the Provisioner on the SAME physical host via host-gateway
      - PROVISIONER_LOCATION=socket://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway" # Maps to the physical host's IP
    networks: [jfn_overlay]
    deploy:
      mode: global
